<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TransitLens · Live View</title>
    <style>
      :root {
        --bg: #000;
        --fg: #f5f5f5;
        --muted: #9aa0a6;
        --accent: #4fc3f7;
        --rec: #ff3b30;
        --bar: rgba(20, 20, 20, 0.75);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--bg);
      }
      #bar {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--bar);
        font-size: 14px;
        transition: opacity 0.3s;
        max-width: calc(100vw - 32px);
      }
      #bar.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        flex: none;
      }
      #dot.live {
        background: #4cd964;
      }
      #status {
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      button {
        border: 1px solid #555;
        background: #222;
        color: var(--fg);
        border-radius: 999px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover {
        border-color: var(--accent);
      }
      #rec-btn.recording {
        background: var(--rec);
        border-color: var(--rec);
      }
      #empty {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-align: center;
        padding: 16px;
        color: var(--muted);
      }
      #empty[hidden] {
        display: none;
      }
      #empty h1 {
        margin: 0;
        color: var(--fg);
        font-size: 1.4rem;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <div id="empty">
      <h1>TransitLens · Live View</h1>
      <p>On the phone, check <b>Cast to laptop</b> on the start screen and tap Start.</p>
    </div>
    <div id="bar">
      <span id="dot"></span>
      <span id="status">starting…</span>
      <button id="rec-btn">● Record</button>
      <button id="reconnect-btn">Reconnect</button>
      <button id="fs-btn">Fullscreen</button>
    </div>
    <script type="module" src="/src/cast/viewer.ts"></script>
  </body>
</html>
