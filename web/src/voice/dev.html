<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice module dev page</title>
    <style>
      body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; background: #111; color: #eee; max-width: 720px; }
      h1 { font-size: 18px; margin: 0 0 12px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
      button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #555; background: #222; color: #eee; cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      input[type=text] { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid #555; background: #000; color: #eee; flex: 1; min-width: 200px; }
      select { font: inherit; padding: 6px; background: #000; color: #eee; border: 1px solid #555; border-radius: 8px; }
      #state { font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #333; }
      #state[data-s=listening] { background: #1b5e20; }
      #state[data-s=thinking]  { background: #e65100; }
      #state[data-s=speaking]  { background: #0d47a1; }
      #answer { font-size: 20px; min-height: 1.4em; margin: 12px 0; }
      #log { font: 12px/1.5 ui-monospace, monospace; background: #000; padding: 8px; border-radius: 8px; height: 220px; overflow: auto; white-space: pre-wrap; }
      .hint { color: #999; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Voice module dev page</h1>
    <p class="hint">
      Desktop: type what the user "said" and press Enter (no mic needed).
      Phone/Chrome: click <b>Start (real mic)</b>, then say "hey grok, what plane is that?".
      Needs voice-service on :8002 for real answers; otherwise you get the offline line.
    </p>

    <div class="row">
      <button id="start-fake">Start (fake mic)</button>
      <button id="start-real">Start (real mic)</button>
      <button id="stop" disabled>Stop</button>
      <span>State: <span id="state" data-s="idle">idle</span></span>
    </div>

    <div class="row">
      <label>Centered plane: <select id="plane"></select></label>
      <label><input type="checkbox" id="speak" checked /> speak answers</label>
      <label><input type="checkbox" id="grokvoice" checked /> Grok voice (server TTS; unchecked = browser voice)</label>
    </div>

    <div class="row">
      <input id="say" type="text" placeholder='Simulate transcript, e.g. "hey grok what plane is that"' />
      <button id="say-btn">Say</button>
      <button id="tilt">Head tilt (listen)</button>
    </div>

    <div id="answer"></div>
    <div id="log"></div>

    <script type="module" src="./dev.ts"></script>
  </body>
</html>
